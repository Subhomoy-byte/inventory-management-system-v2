<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1020"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C6CFF"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)"/>
      <stop offset="50%" stop-color="rgba(124,108,255,0.4)"/>
      <stop offset="100%" stop-color="rgba(34,211,238,0.4)"/>
    </linearGradient>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6"/>

  <!-- Warehouse Outer Building Shell -->
  <path d="M256 96 L416 168 L416 416 L96 416 L96 168 Z" fill="#0d1428" stroke="url(#accentGrad)" stroke-width="20" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Pitched Roof Overhang -->
  <path d="M80 174 L256 94 L432 174" fill="none" stroke="url(#roofGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Warehouse Loading Dock Bay -->
  <rect x="168" y="248" width="176" height="168" rx="12" fill="#080c18" stroke="url(#accentGrad)" stroke-width="12"/>

  <!-- Roll-up Shutter Horizontal Slats -->
  <line x1="184" y1="284" x2="328" y2="284" stroke="rgba(255,255,255,0.22)" stroke-width="8" stroke-linecap="round"/>
  <line x1="184" y1="316" x2="328" y2="316" stroke="rgba(255,255,255,0.22)" stroke-width="8" stroke-linecap="round"/>
  <line x1="184" y1="348" x2="328" y2="348" stroke="rgba(255,255,255,0.22)" stroke-width="8" stroke-linecap="round"/>

  <!-- Warehouse Skylight Indicator -->
  <circle cx="256" cy="154" r="14" fill="#22D3EE"/>

  <!-- Foreground Inventory Cargo Cube (Cyan Center) -->
  <g transform="translate(256, 350)">
    <path d="M0 -42 L36 -24 L0 -6 L-36 -24 Z" fill="#67E8F9"/>
    <path d="M-36 -24 L0 -6 L0 34 L-36 16 Z" fill="#0891B2"/>
    <path d="M0 -6 L36 -24 L36 16 L0 34 Z" fill="#06B6D4"/>
    <path d="M-18 -15 L18 -33" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Left Cargo Cube (Violet) -->
  <g transform="translate(204, 382)">
    <path d="M0 -28 L24 -16 L0 -4 L-24 -16 Z" fill="#C4B5FD"/>
    <path d="M-24 -16 L0 -4 L0 22 L-24 10 Z" fill="#4F46E5"/>
    <path d="M0 -4 L24 -16 L24 10 L0 22 Z" fill="#7C6CFF"/>
  </g>

  <!-- Right Cargo Cube (Violet) -->
  <g transform="translate(308, 382)">
    <path d="M0 -28 L24 -16 L0 -4 L-24 -16 Z" fill="#C4B5FD"/>
    <path d="M-24 -16 L0 -4 L0 22 L-24 10 Z" fill="#4F46E5"/>
    <path d="M0 -4 L24 -16 L24 10 L0 22 Z" fill="#7C6CFF"/>
  </g>
</svg>